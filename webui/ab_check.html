<!doctype html>
<meta charset="utf-8">
<title>Blind A/B — does the learned distance fit better, or just score better?</title>
<!--
  Two banks, the same 128 GM targets, the same engine, the same budget. The only difference is the
  distance CMA-ES minimised: the multi-resolution STFT loss the project has always used, against
  that loss plus a CLAP embedding term. `bank_compare.py` says the second is 29% closer under CLAP
  and 2% further under STFT, and neither of those is an answer, because the complaint that started
  this branch was that the STFT numbers looked fine while the patches did not.

  So this page asks an ear. It is blind and it is forced-choice, for two reasons that are not
  ceremony: the person running it built both banks and knows which one they hope wins, and a
  three-way "A / B / same" with an easy middle collects mostly middles. There is a "can't tell"
  here, but it is off to the side and it is counted separately rather than folded into either bank.

  TWO QUESTIONS, TWO SESSIONS. They are not the same question:

    closer    which of the two is nearer the target. This is what the loss function is *for*, and
              the question the numbers already answered, so it is where the two can be checked
              against each other. A single note, because one note is all the target exists as.
    better    which is the better patch, target ignored. This is what was actually complained
              about. A fitting loss can win the first and lose the second, and if it does, that is
              the most useful thing this page can find out. A short phrase and no target, because
              a single held note is what this question is answered worst by.

  They used to be two rows on one screen and they came back IDENTICAL on all 48 hearings, ties
  included -- #20's first item, reproduced exactly. Two rows of the same buttons, and the cheapest
  way to answer the second is to repeat the first. Separate sessions, separate trial orders and
  separate audio mean the `better` judgement cannot see the `closer` one.

  EVERY PAIR IS ASKED TWICE, once in each playback order, and a pair only counts as a preference
  if it names the same bank both times. The first version of this page did not do that and the run
  it produced is void: the listener chose the first-played clip in 19 of 22 decided trials, a sign
  test at p = 0.001, against a bank split of 13-9 at p = 0.52. The strongest signal in the data was
  the button layout. Balancing which bank plays first -- which the renderer already did -- stops a
  position preference from favouring a bank and does nothing to stop it deciding trials, so the
  bank numbers were 22 votes about order and 3 about audio.

  AND THE TARGET IS PLAYED IMMEDIATELY BEFORE EACH CANDIDATE, as one button, rather than sitting on
  a third button of its own. That was the mechanism, and the fix removed the whole effect: the
  re-run came back 19-18 on the order check, p = 1.000. With [target][1][2] as three buttons,
  whichever candidate follows the target is compared against a fresh memory of it and the other
  against a stale one. "Closer to the target" is only answerable if both candidates sit the same
  distance from hearing it.

  WHO IS LISTENING is recorded, because #20's second item is that one listener who also built the
  banks is blinded to the assignment and not to the hypothesis. Sessions accumulate as separate
  files under presetgen/listening/<comparison>/ and ab_tally.py pools them, so a second ear is a
  second file rather than a re-run.

  WHAT IS HIDDEN: the manifest says which bank is A for each trial, and A/B is flipped at render
  time, so a listener who noticed "the second one is always brighter" learns nothing. The page does
  not look at that field until every trial is voted. Trials are ordered so categories do not come
  in blocks, and the two hearings of one pair are separated by at least four others.

  WHAT IS NOT CONTROLLED, and should be read into any result: 24 pairs is a small n, and requiring
  both hearings to agree makes it smaller -- a discordant pair is not a tie, it is a pair this
  protocol could not ask about. Levels are peak-normalised at render, so loudness cannot decide it.
  The phrase is six notes summed from six monophonic renders, so overlapping notes share an
  oscillator seed in a way a polyphonic board would not; both banks get the same treatment, and it
  would not be fair as a fitting target.

    uv run python presetgen/ab_render.py bank_a.json bank_b.json 3 soundfont
    python3 -m http.server 8765 -d webui        # http://127.0.0.1:8765/ab_check.html
    uv run python presetgen/ab_tally.py presetgen/listening/prev128-vs-soundfont
-->
<style>
  :root { color-scheme: dark; }
  body { background:#15161a; color:#dfe1e6; font:15px/1.5 ui-sans-serif,system-ui,sans-serif;
         margin:0; padding:28px 32px; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .sub { color:#8b909b; font-size:13px; margin-bottom:22px; }
  .bar { height:4px; background:#26282e; border-radius:2px; margin-bottom:26px; }
  .bar i { display:block; height:100%; background:#5b8cff; border-radius:2px; transition:width .2s; }
  .trial { color:#8b909b; font-size:13px; margin-bottom:10px; }
  .trial b { color:#dfe1e6; font-weight:600; }
  .row { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .q { color:#8b909b; font-size:13px; width:74px; flex:none; }
  button { background:#22242a; color:#dfe1e6; border:1px solid #33363e; border-radius:7px;
           padding:9px 16px; font:inherit; cursor:pointer; }
  button:hover { background:#2b2e36; }
  button:disabled { opacity:.4; cursor:default; }
  button.play { min-width:104px; }
  button.play.on { border-color:#5b8cff; color:#a9c2ff; }
  button.pick { min-width:74px; }
  button.pick.sel { background:#2f4a8f; border-color:#5b8cff; }
  button.skip { min-width:auto; padding:9px 12px; color:#8b909b; }
  kbd { font:12px ui-monospace,monospace; color:#6d727d; }
  .foot { margin-top:26px; color:#6d727d; font-size:12px; }
  pre { background:#1b1d22; border:1px solid #2a2d34; border-radius:8px; padding:16px;
        overflow:auto; font:13px/1.55 ui-monospace,monospace; color:#dfe1e6; }
  .hint { color:#6d727d; font-size:12px; margin-left:4px; }
  input { background:#1b1d22; color:#dfe1e6; border:1px solid #33363e; border-radius:7px;
          padding:9px 12px; font:inherit; width:180px; }
  .card { border:1px solid #2a2d34; border-radius:9px; padding:16px 18px; margin-bottom:12px;
          max-width:640px; }
  .card h2 { font-size:14px; margin:0 0 6px; font-weight:600; }
  .card p { margin:0 0 12px; color:#8b909b; font-size:13px; }
</style>

<h1>Blind A/B — <span id="head">loading…</span></h1>
<div class="sub" id="sub">the same target fitted two ways; every pair is asked twice, both ways round</div>
<div class="bar"><i id="prog" style="width:0"></i></div>
<div id="body"></div>
<div class="foot" id="foot"></div>

<script>
const $ = s => document.querySelector(s);
let M = null, Q = null, LISTENER = '', SEQ = [], i = 0, votes = [],
    ctx = null, srcs = [], buf = {};

// What each question is: the audio it plays, the wording, the key hint. Keeping the difference in
// one table is the point -- the two sessions differ in stimulus deliberately, and a difference that
// lives in one place cannot drift back into "the same screen twice", which is how they collapsed.
const QUESTIONS = {
  closer: {
    label: 'closer to the target',
    hint: 'the target plays first each time, so both candidates sit the same distance from it',
    play: n => ['target', n],                  // slots played back to back
    caption: n => `▶ target → ${n}`,
    foot: '<kbd>1</kbd>/<kbd>2</kbd> target→1 / target→2',
  },
  better: {
    label: 'the better patch',
    hint: 'a short phrase, no target — which would you rather have in the bank?',
    play: n => [n + 'P'],
    caption: n => `▶ ${n}`,
    foot: '<kbd>1</kbd>/<kbd>2</kbd> play 1 / 2',
  },
};

// `no-store` on every asset: a re-render reuses the filenames, so a cached manifest or a cached wav
// silently re-asks the pairs the last session answered. That cost #22 a sitting. The stale-render
// guard below only catches an old manifest, and only if the page itself came down fresh.
const fresh = url => fetch(url, {cache: 'no-store'});

async function boot() {
  M = await (await fresh('ab/manifest.json')).json();
  if (!M.sequences) {
    $('#head').textContent = 'stale render';
    $('#body').innerHTML = '<pre>webui/ab/ predates the two-session split.\n\n'
      + 'uv run python presetgen/ab_render.py bank_a.json bank_b.json 3 soundfont</pre>';
    return;
  }
  const u = new URLSearchParams(location.search);
  LISTENER = u.get('listener') || localStorage.getItem('ab_listener') || '';
  if (QUESTIONS[u.get('q')] && LISTENER) return start(u.get('q'));
  startScreen();
}

// One session asks one question. Choosing here rather than running both in a sitting IS the repair:
// the two judgements must not be able to see each other.
function startScreen() {
  // Reset the heading: coming back here after a reveal, it still says "done — better".
  $('#head').textContent = `${M.trials.length} pairs, ${M.banks.join(' vs ')} (${M.source})`;
  $('#sub').textContent = 'one session asks one question — pick it, and say who is listening';
  $('#body').innerHTML = `
    <div class="row">
      <span class="q">listener</span>
      <input id="who" placeholder="a name or initials" value="${LISTENER}">
      <span class="hint">stored with the votes, so a second ear is a second file and not a re-run</span>
    </div>
    ${Object.entries(QUESTIONS).map(([k, q]) => `
      <div class="card">
        <h2>${k} — ${q.label}</h2>
        <p>${q.hint}</p>
        <button class="go" data-q="${k}">start ${M.sequences[k].length} trials</button>
      </div>`).join('')}`;
  document.querySelectorAll('.go').forEach(b => b.onclick = () => {
    const who = $('#who').value.trim();
    if (!who) return $('#who').focus();
    LISTENER = who;
    localStorage.setItem('ab_listener', who);
    start(b.dataset.q);
  });
}

function start(q) {
  Q = q;
  const byId = Object.fromEntries(M.trials.map(t => [t.id, t]));
  SEQ = M.sequences[q].map(s => ({...byId[s.id], rev: s.rev}));
  votes = SEQ.map(() => null);
  i = 0;
  $('#head').textContent = `${q} — ${SEQ.length} trials over ${M.trials.length} pairs, `
                         + `${M.banks.join(' vs ')} (${M.source}) · ${LISTENER}`;
  $('#sub').textContent = QUESTIONS[q].hint;
  $('#foot').innerHTML = `${QUESTIONS[q].foot} &nbsp;&nbsp; <kbd>q</kbd>/<kbd>w</kbd>/<kbd>e</kbd> `
                       + `pick 1 / 2 / can't tell &nbsp;&nbsp; <kbd>Enter</kbd> next`;
  render();
  addEventListener('keydown', key);
}

// One AudioContext, one voice. Starting anything stops whatever is playing: this is a comparison of
// sounds heard one after another, and overlapping them just makes a chord.
//
// `slots` is a list because the closer question plays [target, candidate] back to back. Both
// candidates must be heard at the same remove from the target or the question is unanswerable --
// see the header. The gap is short enough to hold both in one memory and long enough not to sound
// like one sample; the target's own tail is already in the file.
async function play(id, slots, btn) {
  ctx = ctx || new AudioContext();
  const urls = slots.map(s => `ab/${id}_${s}.wav`);
  for (const url of urls)
    if (!buf[url]) buf[url] = await ctx.decodeAudioData(await (await fresh(url)).arrayBuffer());
  srcs.forEach(s => { try { s.stop(); } catch (e) {} });
  srcs = [];
  document.querySelectorAll('.play.on').forEach(b => b.classList.remove('on'));
  let at = ctx.currentTime + 0.02;
  urls.forEach((url, n) => {
    const s = ctx.createBufferSource();
    s.buffer = buf[url];
    s.connect(ctx.destination);
    s.start(at);
    if (n === urls.length - 1) s.onended = () => btn && btn.classList.remove('on');
    at += buf[url].duration + 0.25;
    srcs.push(s);
  });
  btn && btn.classList.add('on');
}

// The trial's "1" and "2" are the render-time slots a and b, swapped when this hearing of the pair
// is the reversed one. Everything the listener touches is 1/2; a and b never leave this function.
const slotOf = (t, n) => (t.rev ? ['b', 'a'] : ['a', 'b'])[n - 1];

function render() {
  if (i >= SEQ.length) return results();
  const t = SEQ[i], v = votes[i];
  $('#prog').style.width = `${i / SEQ.length * 100}%`;
  // The name and category are shown: they say what the TARGET is, which the listener hears anyway,
  // and knowing "this is meant to be a plucked note" is part of judging whether a fit got there.
  // Neither one hints at which bank is which -- and the pair will come round again the other way
  // up, so recognising the name on the second hearing gives nothing away either.
  const q = QUESTIONS[Q];
  $('#body').innerHTML = `
    <div class="trial">trial <b>${i + 1}</b> of ${SEQ.length} &nbsp;·&nbsp;
      ${t.category} — <b>${t.name}</b></div>
    <div class="row">
      <span class="q">${Q}</span>
      <button class="play" data-n="1">${q.caption(1)}</button>
      <button class="play" data-n="2">${q.caption(2)}</button>
      <button class="pick" data-v="1">1</button>
      <button class="pick" data-v="2">2</button>
      <button class="pick skip" data-v="tie">can't tell</button>
      <span class="hint">${q.label}</span>
    </div>
    <div class="row">
      <button id="next" ${v ? '' : 'disabled'}>next →</button>
      <button id="back" ${i ? '' : 'disabled'}>← back</button>
    </div>`;
  document.querySelectorAll('.play').forEach(b =>
    b.onclick = () => play(t.id, q.play(slotOf(t, +b.dataset.n)), b));
  document.querySelectorAll('.pick').forEach(b => {
    if (v === b.dataset.v) b.classList.add('sel');
    b.onclick = () => pick(b.dataset.v);
  });
  $('#next').onclick = () => { i++; render(); };
  $('#back').onclick = () => { i--; render(); };
}

function pick(v) {
  votes[i] = v;
  render();
}

function key(e) {
  if (!Q || i >= SEQ.length) return;
  const t = SEQ[i];
  if (e.key === '1' || e.key === '2')
    return play(t.id, QUESTIONS[Q].play(slotOf(t, +e.key)),
                document.querySelector(`.play[data-n="${e.key}"]`));
  const map = {q: '1', w: '2', e: 'tie'};
  if (map[e.key]) return pick(map[e.key]);
  if (e.key === 'Enter' && votes[i]) { i++; render(); }
}

// ---- tally. Only here does the page read which bank was A.
function binomP(k, n) {                       // two-sided sign test, exact; ties excluded from n
  if (!n) return 1;
  const c = (n, k) => { let r = 1; for (let j = 0; j < k; j++) r = r * (n - j) / (j + 1); return r; };
  const pmf = j => c(n, j) * Math.pow(0.5, n);
  const lo = Math.min(k, n - k);
  let p = 0;
  for (let j = 0; j <= lo; j++) p += pmf(j);
  return Math.min(1, 2 * p);
}

function results() {
  $('#prog').style.width = '100%';
  const [b0, b1] = M.banks;
  // One record per HEARING, resolved from 1/2 to a bank, plus which bank played first. `first` is
  // written into the file so the order check survives without the manifest, which is gitignored and
  // regenerated per run -- the first time this was analysed the join had to go back to the manifest
  // to find out that order had decided the whole thing.
  const out = SEQ.map((t, n) => ({
    id: t.id, name: t.name, category: t.category, spread: t.spread, band: t.band, rev: !!t.rev,
    first: t[slotOf(t, 1)],
    vote: votes[n] === 'tie' ? 'tie' : t[slotOf(t, +votes[n])],
  }));

  // The order check comes FIRST, because it decides whether the rest is worth reading.
  const dec = out.filter(r => r.vote !== 'tie');
  const f = dec.filter(r => r.vote === r.first).length;
  const pOrd = binomP(f, dec.length);
  const lines = ['order check -- did the first-played clip win, whichever bank it was?',
    `  first ${f}   second ${dec.length - f}   p = ${pOrd.toFixed(3)}`
    + (pOrd < 0.05 ? '   * order is deciding trials' : ''), ''];

  // A pair counts only if both hearings name the same bank. Discordant is not a tie: a tie is the
  // listener saying the two are alike, and a discordant pair is the protocol failing to ask.
  const ids = [...new Set(out.map(r => r.id))];
  const verdict = {};
  for (const id of ids) {
    const h = out.filter(r => r.id === id).map(r => r.vote);
    verdict[id] = h.length < 2 ? '?'
                : h.every(x => x === 'tie') ? 'tie' : h[0] === h[1] ? h[0] : 'flip';
  }
  const n0 = ids.filter(id => verdict[id] === b0).length;
  const n1 = ids.filter(id => verdict[id] === b1).length;
  const nt = ids.filter(id => verdict[id] === 'tie').length;
  const nf = ids.filter(id => verdict[id] === 'flip').length;
  const p = binomP(n0, n0 + n1);
  lines.push(`${Q}   ${b0} ${n0}   ${b1} ${n1}   both-ways tie ${nt}   order-dependent ${nf}`
           + `   p = ${p.toFixed(3)}${p < 0.05 ? '  *' : ''}`);

  // Does the CLAP spread predict the ear? This is the band the pair was SAMPLED from, which is why
  // ab_render.py stratifies -- with the old top-of-the-range selection every pair sat in one band
  // and the question could not be asked at all.
  lines.push('', 'by the CLAP spread band the pair was sampled from (0 = narrowest):');
  for (const b of [...new Set(out.map(r => r.band))].sort()) {
    const bid = ids.filter(id => out.find(r => r.id === id).band === b);
    const sp = bid.map(id => out.find(r => r.id === id).spread);
    lines.push(`  band ${b}  ${b0} ${bid.filter(id => verdict[id] === b0).length}`
             + `   ${b1} ${bid.filter(id => verdict[id] === b1).length}`
             + `   tie ${bid.filter(id => verdict[id] === 'tie').length}`
             + `   order-dependent ${bid.filter(id => verdict[id] === 'flip').length}`
             + `   spread ${Math.min(...sp).toFixed(3)}-${Math.max(...sp).toFixed(3)}`);
  }

  lines.push('', `by category (0 = ${b0}, 1 = ${b1}, ~ = order-dependent, - = tie both ways)`);
  for (const c of [...new Set(out.map(r => r.category))]) {
    const cid = ids.filter(id => out.find(r => r.id === id).category === c);
    lines.push(`  ${c.padEnd(8)} ` + cid.map(id =>
      ({[b0]: '0', [b1]: '1', tie: '-', flip: '~'})[verdict[id]] || '?').join(''));
  }
  lines.push('', `${ids.length} pairs, one question, one listener. Requiring both hearings to`,
    'agree shrinks n on purpose. This is one session: run the other question, or hand the page to',
    'another ear, and pool the files with ab_tally.py rather than reading any one of them alone.');
  if (pOrd < 0.05) lines.push('', 'The order effect above is significant, so read the bank line as',
    'provisional -- most of what was voted on was which button came first.');

  const fn = `ab_${M.comparison || M.banks.join('-vs-')}_${Q}_`
           + `${LISTENER.replace(/[^A-Za-z0-9_-]/g, '_')}.json`;
  $('#head').textContent = `done — ${Q}, ${LISTENER}`;
  $('#sub').textContent = `save the file into presetgen/listening/${M.comparison || ''}/`;
  $('#body').innerHTML = `<pre>${lines.join('\n')}</pre>
    <div class="row"><button id="save">save ${fn}</button>
    <button id="again">back to the start screen</button></div>`;
  $('#save').onclick = () => {
    const blob = new Blob([JSON.stringify(
      {source: M.source, banks: M.banks, comparison: M.comparison, seed: M.seed,
       question: Q, listener: LISTENER, votes: out}, null, 1)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fn;
    a.click();
  };
  $('#again').onclick = () => { Q = null; $('#foot').innerHTML = ''; startScreen(); };
}

boot();
</script>
