<!doctype html>
<meta charset="utf-8">
<title>Blind A/B — does the learned distance fit better, or just score better?</title>
<!--
  Two banks, the same 128 GM targets, the same engine, the same budget. The only difference is the
  distance CMA-ES minimised: the multi-resolution STFT loss the project has always used, against
  that loss plus a CLAP embedding term. `bank_compare.py` says the second is 29% closer under CLAP
  and 2% further under STFT, and neither of those is an answer, because the complaint that started
  this branch was that the STFT numbers looked fine while the patches did not.

  So this page asks an ear. It is blind and it is forced-choice, for two reasons that are not
  ceremony: the person running it built both banks and knows which one they hope wins, and a
  three-way "A / B / same" with an easy middle collects mostly middles. There is a "can't tell"
  here, but it is off to the side and it is counted separately rather than folded into either bank.

  IT ASKS TWO QUESTIONS PER TRIAL, and they are not the same question:

    closer    which of A and B is nearer the target. This is what the loss function is *for*, and
              it is the question the numbers already answered -- so it is the one where the two
              can be checked against each other.
    better    which is the better patch, target ignored. This is what was actually complained
              about. A fitting loss can win the first and lose the second, and if it does, that is
              the most useful thing this page can find out.

  EVERY PAIR IS ASKED TWICE, once in each playback order, and a pair only counts as a preference
  if it names the same bank both times. The first version of this page did not do that and the run
  it produced is void: the listener chose the first-played clip in 19 of 22 decided trials, a sign
  test at p = 0.001, against a bank split of 13-9 at p = 0.52. The strongest signal in the data was
  the button layout. Balancing which bank plays first -- which the renderer already did -- stops a
  position preference from favouring a bank and does nothing to stop it deciding trials, so the
  bank numbers were 22 votes about order and 3 about audio.

  AND THE TARGET IS PLAYED IMMEDIATELY BEFORE EACH CANDIDATE, as one button, rather than sitting on
  a third button of its own. That is the likely mechanism for most of the effect above: with
  [target][1][2] as three buttons, whichever candidate is heard next to the target gets compared
  against a fresh memory of it and the other is judged against a stale one. "Closer to the target"
  is only answerable if both candidates are the same distance from hearing it. The `better`
  question does not involve the target and gets bare playback.

  WHAT IS HIDDEN: the manifest says which bank is A for each trial, and A/B is flipped at render
  time, so a listener who noticed "the second one is always brighter" learns nothing. The page does
  not look at that field until every trial is voted. Trials are ordered so categories do not come
  in blocks, and the two hearings of one pair are separated by a block of others.

  WHAT IS NOT CONTROLLED, and should be read into any result: 24 pairs is a small n, and requiring
  both hearings to agree makes it smaller -- a discordant pair is not a tie, it is a pair this
  protocol could not ask about. Levels are peak-normalised at render, so loudness cannot decide it.
  Everything is one held note of 1.6 s, which is what the search optimised and is not what a patch
  gets used for -- a bank that wins here has won at single notes.

    uv run python presetgen/ab_render.py bank_a.json bank_b.json 3 soundfont
    python3 -m http.server 8765 -d webui        # http://127.0.0.1:8765/ab_check.html
    uv run python presetgen/ab_tally.py ~/Downloads/ab_votes.json
-->
<style>
  :root { color-scheme: dark; }
  body { background:#15161a; color:#dfe1e6; font:15px/1.5 ui-sans-serif,system-ui,sans-serif;
         margin:0; padding:28px 32px; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .sub { color:#8b909b; font-size:13px; margin-bottom:22px; }
  .bar { height:4px; background:#26282e; border-radius:2px; margin-bottom:26px; }
  .bar i { display:block; height:100%; background:#5b8cff; border-radius:2px; transition:width .2s; }
  .trial { color:#8b909b; font-size:13px; margin-bottom:10px; }
  .trial b { color:#dfe1e6; font-weight:600; }
  .row { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .q { color:#8b909b; font-size:13px; width:74px; flex:none; }
  button { background:#22242a; color:#dfe1e6; border:1px solid #33363e; border-radius:7px;
           padding:9px 16px; font:inherit; cursor:pointer; }
  button:hover { background:#2b2e36; }
  button:disabled { opacity:.4; cursor:default; }
  button.play { min-width:104px; }
  button.play.on { border-color:#5b8cff; color:#a9c2ff; }
  button.pick { min-width:74px; }
  button.pick.sel { background:#2f4a8f; border-color:#5b8cff; }
  button.skip { min-width:auto; padding:9px 12px; color:#8b909b; }
  kbd { font:12px ui-monospace,monospace; color:#6d727d; }
  .foot { margin-top:26px; color:#6d727d; font-size:12px; }
  pre { background:#1b1d22; border:1px solid #2a2d34; border-radius:8px; padding:16px;
        overflow:auto; font:13px/1.55 ui-monospace,monospace; color:#dfe1e6; }
  .hint { color:#6d727d; font-size:12px; margin-left:4px; }
</style>

<h1>Blind A/B — <span id="head">loading…</span></h1>
<div class="sub" id="sub">the same target fitted two ways; every pair is asked twice, both ways round</div>
<div class="bar"><i id="prog" style="width:0"></i></div>
<div id="body"></div>
<div class="foot">
  <kbd>1</kbd>/<kbd>2</kbd> target→1 / target→2 &nbsp; <kbd>3</kbd>/<kbd>4</kbd> 1 / 2 alone &nbsp;&nbsp;
  <kbd>q</kbd>/<kbd>w</kbd>/<kbd>e</kbd> closer: 1 / 2 / can't tell &nbsp;
  <kbd>a</kbd>/<kbd>s</kbd>/<kbd>d</kbd> better: 1 / 2 / can't tell &nbsp;
  <kbd>Enter</kbd> next
</div>

<script>
const $ = s => document.querySelector(s);
let M = null, SEQ = [], i = 0, votes = [], ctx = null, srcs = [], buf = {};

async function boot() {
  M = await (await fetch('ab/manifest.json')).json();
  const byId = Object.fromEntries(M.trials.map(t => [t.id, t]));
  // The renderer supplies the counterbalanced sequence, so the seed that chose the pairs also chose
  // the order they are heard in. An older manifest has no `sequence`; fall back to one pass so a
  // stale render still opens, and say so in the header rather than silently running the void design.
  SEQ = (M.sequence || M.trials.map(t => ({id: t.id, rev: false})))
        .map(s => ({...byId[s.id], rev: s.rev}));
  votes = SEQ.map(() => ({closer: null, better: null}));
  $('#head').textContent = `${SEQ.length} trials over ${M.trials.length} pairs, `
                         + `${M.banks.join(' vs ')} (${M.source})`
                         + (M.sequence ? '' : '  — OLD MANIFEST, not counterbalanced');
  render();
  addEventListener('keydown', key);
}

// One AudioContext, one voice. Starting anything stops whatever is playing: this is a comparison of
// sounds heard one after another, and overlapping them just makes a chord.
//
// `slots` is a list because the closer question plays [target, candidate] back to back. Both
// candidates must be heard at the same remove from the target or the question is unanswerable --
// see the header. The gap is short enough to hold both in one memory and long enough not to sound
// like one sample; the target's own tail is already in the file.
async function play(id, slots, btn) {
  ctx = ctx || new AudioContext();
  const urls = slots.map(s => `ab/${id}_${s}.wav`);
  for (const url of urls)
    if (!buf[url]) buf[url] = await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer());
  srcs.forEach(s => { try { s.stop(); } catch (e) {} });
  srcs = [];
  document.querySelectorAll('.play.on').forEach(b => b.classList.remove('on'));
  let at = ctx.currentTime + 0.02;
  urls.forEach((url, n) => {
    const s = ctx.createBufferSource();
    s.buffer = buf[url];
    s.connect(ctx.destination);
    s.start(at);
    if (n === urls.length - 1) s.onended = () => btn && btn.classList.remove('on');
    at += buf[url].duration + 0.25;
    srcs.push(s);
  });
  btn && btn.classList.add('on');
}

// The trial's "1" and "2" are the render-time slots a and b, swapped when this hearing of the pair
// is the reversed one. Everything the listener touches is 1/2; a and b never leave this function.
const slotOf = (t, n) => (t.rev ? ['b', 'a'] : ['a', 'b'])[n - 1];

function render() {
  if (i >= SEQ.length) return results();
  const t = SEQ[i], v = votes[i];
  $('#prog').style.width = `${i / SEQ.length * 100}%`;
  // The name and category are shown: they say what the TARGET is, which the listener hears anyway,
  // and knowing "this is meant to be a plucked note" is part of judging whether a fit got there.
  // Neither one hints at which bank is which -- and the pair will come round again the other way
  // up, so recognising the name on the second hearing gives nothing away either.
  $('#body').innerHTML = `
    <div class="trial">trial <b>${i + 1}</b> of ${SEQ.length} &nbsp;·&nbsp;
      target: <b>${t.category} — ${t.name}</b></div>
    <div class="row">
      <span class="q">closer</span>
      <button class="play" data-pair="1">▶ target → 1</button>
      <button class="play" data-pair="2">▶ target → 2</button>
      <button class="pick" data-k="closer" data-v="1">1</button>
      <button class="pick" data-k="closer" data-v="2">2</button>
      <button class="pick skip" data-k="closer" data-v="tie">can't tell</button>
    </div>
    <div class="row">
      <span class="q">better</span>
      <button class="play" data-solo="1">▶ 1</button>
      <button class="play" data-solo="2">▶ 2</button>
      <button class="pick" data-k="better" data-v="1">1</button>
      <button class="pick" data-k="better" data-v="2">2</button>
      <button class="pick skip" data-k="better" data-v="tie">can't tell</button>
      <span class="hint">as a patch, target ignored</span>
    </div>
    <div class="row">
      <button id="next" ${v.closer && v.better ? '' : 'disabled'}>next →</button>
      <button id="back" ${i ? '' : 'disabled'}>← back</button>
    </div>`;
  document.querySelectorAll('.play').forEach(b => {
    const n = +(b.dataset.pair || b.dataset.solo);
    const slots = b.dataset.pair ? ['target', slotOf(t, n)] : [slotOf(t, n)];
    b.onclick = () => play(t.id, slots, b);
  });
  document.querySelectorAll('.pick').forEach(b => {
    if (v[b.dataset.k] === b.dataset.v) b.classList.add('sel');
    b.onclick = () => pick(b.dataset.k, b.dataset.v);
  });
  $('#next').onclick = () => { i++; render(); };
  $('#back').onclick = () => { i--; render(); };
}

function pick(k, v) {
  votes[i][k] = v;
  render();
}

function key(e) {
  if (i >= SEQ.length) return;
  const t = SEQ[i];
  if ('1234'.includes(e.key)) {
    const n = +e.key, pair = n <= 2;
    const sel = pair ? `.play[data-pair="${n}"]` : `.play[data-solo="${n - 2}"]`;
    const c = pair ? n : n - 2;
    return play(t.id, pair ? ['target', slotOf(t, c)] : [slotOf(t, c)], document.querySelector(sel));
  }
  const map = {q: ['closer', '1'], w: ['closer', '2'], e: ['closer', 'tie'],
               a: ['better', '1'], s: ['better', '2'], d: ['better', 'tie']};
  if (map[e.key]) return pick(...map[e.key]);
  if (e.key === 'Enter' && votes[i].closer && votes[i].better) { i++; render(); }
}

// ---- tally. Only here does the page read which bank was A.
function binomP(k, n) {                       // two-sided sign test, exact; ties excluded from n
  if (!n) return 1;
  const c = (n, k) => { let r = 1; for (let j = 0; j < k; j++) r = r * (n - j) / (j + 1); return r; };
  const pmf = j => c(n, j) * Math.pow(0.5, n);
  const lo = Math.min(k, n - k);
  let p = 0;
  for (let j = 0; j <= lo; j++) p += pmf(j);
  return Math.min(1, 2 * p);
}

function results() {
  $('#prog').style.width = '100%';
  const [b0, b1] = M.banks;
  // One record per HEARING, resolved from 1/2 to a bank, plus which bank played first. `first` is
  // written into the file so the order check survives without the manifest, which is gitignored and
  // regenerated per run -- the first time this was analysed the join had to go back to the manifest
  // to find out that order had decided the whole thing.
  const out = SEQ.map((t, n) => ({
    id: t.id, name: t.name, category: t.category, spread: t.spread, rev: !!t.rev,
    first: t[slotOf(t, 1)],
    closer: votes[n].closer === 'tie' ? 'tie' : t[slotOf(t, +votes[n].closer)],
    better: votes[n].better === 'tie' ? 'tie' : t[slotOf(t, +votes[n].better)],
  }));

  // The order check comes FIRST, because it decides whether the rest is worth reading.
  const lines = ['order check -- did the first-played clip win, whichever bank it was?'];
  let ordered = false;
  for (const k of ['closer', 'better']) {
    const d = out.filter(r => r[k] !== 'tie');
    const f = d.filter(r => r[k] === r.first).length;
    const p = binomP(f, d.length);
    ordered = ordered || p < 0.05;
    lines.push(`  ${k.padEnd(7)}  first ${String(f).padStart(2)}   `
             + `second ${String(d.length - f).padStart(2)}   p = ${p.toFixed(3)}`
             + (p < 0.05 ? '   * order is deciding trials' : ''));
  }
  lines.push('');

  // A pair counts only if both hearings name the same bank. Discordant is not a tie: a tie is the
  // listener saying the two are alike, and a discordant pair is the protocol failing to ask.
  const ids = [...new Set(out.map(r => r.id))];
  for (const k of ['closer', 'better']) {
    const w = {}; w[b0] = 0; w[b1] = 0;
    let flip = 0, tie = 0;
    for (const id of ids) {
      const h = out.filter(r => r.id === id).map(r => r[k]);
      if (h.length < 2) continue;
      if (h.every(x => x === 'tie')) tie++;
      else if (h[0] === h[1]) w[h[0]]++;
      else flip++;
    }
    const p = binomP(w[b0], w[b0] + w[b1]);
    lines.push(`${k.padEnd(7)}  ${b0} ${String(w[b0]).padStart(2)}   ${b1} ${String(w[b1]).padStart(2)}`
             + `   both-ways tie ${String(tie).padStart(2)}   order-dependent ${String(flip).padStart(2)}`
             + `   p = ${p.toFixed(3)}${p < 0.05 ? '  *' : ''}`);
  }

  lines.push('', 'by category (closer / better; 0 = ' + b0 + ', 1 = ' + b1
                 + ', ~ = order-dependent, - = tie both ways)');
  for (const c of [...new Set(out.map(r => r.category))]) {
    const cid = ids.filter(id => out.find(r => r.id === id).category === c);
    const f = k => cid.map(id => {
      const h = out.filter(r => r.id === id).map(r => r[k]);
      if (h.length < 2) return '?';
      if (h.every(x => x === 'tie')) return '-';
      return h[0] === h[1] ? (h[0] === b0 ? '0' : '1') : '~';
    }).join('');
    lines.push(`  ${c.padEnd(8)} ${f('closer')}  ${f('better')}`);
  }
  lines.push('', `${ids.length} pairs. Requiring both hearings to agree shrinks n, on purpose: a`,
    'split of 17-7 over the pairs that survive clears p<0.05, and a pile of order-dependent',
    'pairs means the two banks are not separable by this ear at single notes.');
  if (ordered) lines.push('', 'The order effect above is significant. Read the bank result as',
    'provisional at best -- most of what was voted on was which button came first.');

  $('#head').textContent = 'done';
  $('#sub').textContent = 'the reveal, and the vote file to keep';
  $('#body').innerHTML = `<pre>${lines.join('\n')}</pre>
    <div class="row"><button id="save">save ab_votes.json</button>
    <button id="again">start over</button></div>`;
  $('#save').onclick = () => {
    const blob = new Blob([JSON.stringify({source: M.source, banks: M.banks, seed: M.seed,
                                           votes: out}, null, 1)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ab_votes.json';
    a.click();
  };
  $('#again').onclick = () => { i = 0; votes = SEQ.map(() => ({closer: null, better: null})); render(); };
}

boot();
</script>
