[project]
name = "xls-synth"
version = "0.1.0"
description = "Verify the Basys 3 XLS synthesizer over USB"
license = "Apache-2.0"
requires-python = ">=3.10"
# Core verify/analysis is stdlib-only (termios); analysis uses math/statistics.
# RUNTIME (host tools and tests). Everything here has wheels on common platforms so `uv sync`
# works on any Mac. The heavy preset-generation tools live in the optional [presetgen] extra below
# (dawdreamer etc. lack wheels on some platforms and aren't needed to run the synth) -> install
# those only for dev work with `uv sync --extra presetgen`.
#
# Nothing here is needed to PLAY the synth: M31 made webui/ a static page that reaches the board
# through Web MIDI / Web Serial, so fastapi, uvicorn and midigen-lib left with the server.
dependencies = [
    "numpy>=2.0.2",
    "sounddevice>=0.5.5",       # host Tiliqua transport: UAC2 capture (prebuilt wheels — no compiler)
    "mido>=1.3.3",              # MIDI message helpers
    "soundfile>=0.13.1",        # capture/record WAVs
    "pillow>=11.3.0",           # test-suite caption cards
]

[project.optional-dependencies]
# MIDI out from the HOST to the Tiliqua (host/transport/usbaudio.py, used by test/ and presetgen/).
# python-rtmidi builds from C++ source, which some locked-down machines block (e.g. Santa on corp
# Macs), so it stays optional: the Basys 3 flow sends MIDI down the same UART and never wants it,
# and the browser UI has its own Web MIDI. Install where a compiler is allowed:
#   uv sync --extra localmidi
localmidi = ["python-rtmidi>=1.5.8"]
# Docs: regenerate the DSP signal-flow SVGs in docs/ from docs/gen_dsp_diagrams.py.
# Only needed to re-render the diagrams (the committed docs/dsp_*.svg display without it):
#   uv sync --extra docs && uv run python docs/gen_dsp_diagrams.py
docs = ["schemdraw>=0.19"]
# Preset generation / search / optimization (presetgen/). Not needed to run or demo the synth.
presetgen = [
    "dawdreamer>=0.8.3",
    "pedalboard>=0.9.19",
    "pyfluidsynth>=1.3.6",
    "numba>=0.60.0",
    "cma>=4.4.4",
    "scipy>=1.13.1",
]
# Learned audio distances for preset fitting (presetgen/loss_deep.py) and the CLAP name audit
# (presetgen/name_audit.py). Separate from [presetgen] because it is heavy — torch plus a ~2 GB
# CLAP checkpoint on first use — and because it does NOT need the target-corpus half of presetgen
# (dawdreamer/fluidsynth render targets; rendering our own engine and embedding audio does not).
# It repeats scipy/numba/cma so `uv sync --extra deepfit` alone can render, fit and audit:
#   uv sync --extra deepfit
deepfit = [
    "torch>=2.6.0",
    "cdpam>=0.0.6",             # human-JND-trained perceptual audio distance (22.05 kHz)
    "librosa>=0.10.2",          # cdpam's loader dependency, undeclared in its own metadata
    # CLAP audio<->text embeddings (the name-vs-sound audit) come through transformers'
    # ClapModel, NOT the `laion-clap` package: that one pins numpy==1.23.5 / <2.0.0, which is
    # unsatisfiable against this project's numpy>=2.0.2. Same LAION checkpoints either way.
    "transformers>=4.45",
    "numba>=0.60.0",
    "cma>=4.4.4",
    "scipy>=1.13.1",
    "resampy>=0.4.3",
]
